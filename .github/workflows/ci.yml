name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install toolkit
        run: python -m pip install -e ".[dev]"
      - name: Compile and test Python package
        run: |
          python -m compileall -q 02-toolkit/src/hindsight_deploy
          pytest -q
          hindsight-deploy --help
          hindsight-deploy --mode production --help
      - name: Check shell syntax
        run: |
          bash -n 01-deploy/scripts/deploy.sh
          bash -n 01-deploy/scripts/system-check.sh
          bash -n 01-deploy/scripts/systemd-install.sh
      - name: Validate Compose profiles
        run: |
          docker compose --env-file 01-deploy/compose/basic/.env.example -f 01-deploy/compose/basic/hindsight.yaml config --quiet
          docker compose --env-file 01-deploy/compose/production/.env.example -f 01-deploy/compose/production/hindsight.yaml config --quiet
